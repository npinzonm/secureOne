# Ambiente de pruebas aislado: datos efímeros (tmpfs), imagen backend con dependencias de test.
# Uso: docker compose -p secureone_test -f docker-compose.yml -f docker-compose.test.yml up -d --build
services:
  backup:
    volumes: !override
      - backups_test:/backups
  mailpit:
    ports: !override
      - "127.0.0.1:${TEST_MAILPIT_UI_PORT:-8026}:8025"
  nginx:
    ports: !override
      - "127.0.0.1:${TEST_HTTP_PORT:-8081}:8080"
  backend:
    networks: [edge, data, mail]   # las pruebas de integración consultan la API de Mailpit
    depends_on:
      mailpit: { condition: service_healthy }
    build: { context: ./backend, target: dev }
    image: secureone/backend:test
    environment:
      APP_ENV: test
      RUFF_CACHE_DIR: /tmp/ruff
      PYTHONPYCACHEPREFIX: /tmp/pycache
      # SOLO en el ambiente de pruebas: credenciales owner para que las pruebas de integración
      # preparen tablas de prueba y simulen manipulación/caída de la auditoría.
      TEST_OWNER_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      TEST_OWNER_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
  postgres:
    volumes: !override
      - type: tmpfs
        target: /var/lib/postgresql/data
  redis:
    volumes: !override
      - type: tmpfs
        target: /data

volumes:
  backups_test: {}
