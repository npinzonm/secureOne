# Nginx sin privilegios (escucha en 8080 dentro del contenedor).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 10m;   # subidas TH (PROPUESTO; ajustar con PD-09)

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Log sin cabeceras de autorización ni cookies ni query string (puede contener datos).
  log_format main '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time rid=$request_id';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Límite por IP para el login (complementa el bloqueo por cuenta, REQ-AUTH-07).
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    # Readiness solo para la red interna.
    location = /api/v1/health/ready { return 404; }

    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      include /etc/nginx/proxy_params.conf;
      proxy_pass http://backend;
    }

    location /api/ {
      include /etc/nginx/proxy_params.conf;
      proxy_pass http://backend;
    }

    location / {
      include /etc/nginx/proxy_params.conf;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://frontend;
    }
  }
}
