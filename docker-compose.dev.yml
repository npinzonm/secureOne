# Override de desarrollo: recarga en caliente, docs de API y BD accesible solo en 127.0.0.1.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  backend:
    build: { context: ./backend, target: dev }
    image: secureone/backend:dev
    read_only: false
    environment:
      APP_ENV: dev
      LOG_LEVEL: DEBUG
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
      - spool:/var/lib/secureone/spool

  frontend:
    build: { context: ./frontend, target: dev }
    image: secureone/frontend:dev
    volumes:
      - ./frontend/src:/app/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5

  postgres:
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"
    networks: [data, devdb]

networks:
  devdb: {}
