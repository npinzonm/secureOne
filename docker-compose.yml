# SecureOne — stack base (equivale al ambiente "prod" local).
# Uso: ./scripts/init-env.sh && docker compose up -d --build
name: ${COMPOSE_PROJECT_NAME:-secureone}

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    read_only: true
    tmpfs: ["/tmp"]
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [edge]

  frontend:
    <<: *hardening
    build: { context: ./frontend, target: runtime }
    image: secureone/frontend:local
    networks: [edge]

  backend:
    <<: *hardening
    build: { context: ./backend, target: runtime }
    image: secureone/backend:local
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      # El backend usa SOLO el rol de runtime; nunca las credenciales owner.
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER requerido}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD requerido}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-secureone@localhost.test}
    volumes:
      - spool:/var/lib/secureone/spool
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [edge, data]

  # Worker: entregas de notificaciones, reintentos, spool de auditoría y sesiones abandonadas.
  worker:
    <<: *hardening
    image: secureone/backend:local
    build: { context: ./backend, target: runtime }
    read_only: true
    tmpfs: ["/tmp"]
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER requerido}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD requerido}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-secureone@localhost.test}
    volumes:
      - spool:/var/lib/secureone/spool
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    networks: [data, mail]

  # SMTP local del prototipo (v1.0 sin integraciones corporativas obligatorias; PD-11).
  # UI solo en 127.0.0.1:8025.
  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.21.8
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [mail]

  # Ejecución única: crea/actualiza el rol de runtime y aplica migraciones (owner).
  migrate:
    image: secureone/backend:local
    build: { context: ./backend, target: runtime }
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    command: ["python", "-m", "app.cli", "migrate"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER requerido}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD requerido}
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]

  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]

  redis:
    <<: *hardening
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [data]

networks:
  edge: {}
  mail: {}
  data:
    internal: true   # postgres y redis sin salida ni acceso desde fuera de la red

volumes:
  pgdata: {}
  redisdata: {}
  spool: {}
